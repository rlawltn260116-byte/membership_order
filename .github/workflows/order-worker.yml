name: Membership order background worker

on:
  workflow_dispatch:
    inputs:
      b2b_http_cart:
        description: '이로움·보필 HTTP 장바구니 준비 시험을 실행한다(주문 제출 없음). 즉시실행기 호출에서는 꺼져 있다.'
        type: boolean
        default: false
  # 평소 실행은 주문워커 즉시실행기(scripts/order_dispatcher.gs, Apps Script)가 대기 작업이 생기면 1분 안에 workflow_dispatch로 호출한다.
  # GitHub cron은 10~40분씩 밀려서, 아래 예약은 즉시실행기가 멈췄을 때를 대비한 보조용(평일 업무시간 30분 간격)만 남김.
  schedule:
    - cron: "38 23 * * 0-4"           # KST 월~금 08:38
    - cron: "8,38 0-5 * * 1-5"        # KST 월~금 09:08 ~ 14:38, 30분 간격
    - cron: "8 6 * * 1-5"             # KST 월~금 15:08

permissions:
  contents: write
  actions: write

concurrency:
  group: membership-order-worker
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check worker secrets
        id: secrets
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          EROUM_STORAGE_STATE_JSON: ${{ secrets.EROUM_STORAGE_STATE_JSON }}
        shell: bash
        run: |
          if [[ -z "$FIREBASE_DATABASE_URL" || -z "$FIREBASE_SERVICE_ACCOUNT_JSON" || -z "$EROUM_STORAGE_STATE_JSON" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Worker secrets are not configured; skipping this run."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install worker dependencies
        if: steps.secrets.outputs.enabled == 'true'
        working-directory: worker/order-runner
        run: npm install
      - name: Build worker
        if: steps.secrets.outputs.enabled == 'true'
        working-directory: worker/order-runner
        run: npm run build
      # 큐의 HTTP 준비 모듈(http_queue.py)용 Python. 이 컨테이너에서는 actions/setup-python을 쓰지 않고
      # 이미지의 python3(없으면 apt로 설치)로 venv를 만든다. 경로는 B2B_HTTP_PYTHON으로 다음 단계에 넘긴다.
      - name: Install HTTP preparation Python dependencies
        if: steps.secrets.outputs.enabled == 'true'
        # 설치가 실패해도 기존 이로움 Playwright 처리는 계속 돌아야 한다. 실패하면 HTTP 준비만 보류된다.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/b2b-http-venv"
          # python3가 없거나 venv(ensurepip)가 빠진 이미지면 apt로 설치한 뒤 다시 만든다.
          if ! python3 -m venv "$venv" >/dev/null 2>&1; then
            rm -rf "$venv"
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-venv
            python3 -m venv "$venv"
          fi
          "$venv/bin/python" -c "import sys; assert sys.version_info >= (3, 12), sys.version"
          "$venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir -r worker/order-runner/requirements-http.txt
          "$venv/bin/python" -c "import cryptography"
          echo "B2B_HTTP_PYTHON=$venv/bin/python" >> "$GITHUB_ENV"
      - name: Process queued orders
        if: steps.secrets.outputs.enabled == 'true'
        working-directory: worker/order-runner
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          EROUM_STORAGE_STATE_JSON: ${{ secrets.EROUM_STORAGE_STATE_JSON }}
          FINAL_SUBMISSION_APPROVAL_KEY: ${{ secrets.FINAL_SUBMISSION_APPROVAL_KEY }}
          # 큐의 보필 준비·제출은 저장소 변수로만 켠다. 수동 시험 입력과 무관하다.
          ENABLE_B2B_HTTP_CART: ${{ vars.ENABLE_B2B_HTTP_CART }}
          ENABLE_B2B_HTTP_SUBMIT: ${{ vars.ENABLE_B2B_HTTP_SUBMIT }}
          B2B_HTTP_SUBMIT_VENDORS: ${{ vars.B2B_HTTP_SUBMIT_VENDORS }}
          EROUM_LOGIN_ID: ${{ secrets.EROUM_LOGIN_ID }}
          EROUM_LOGIN_PASSWORD: ${{ secrets.EROUM_LOGIN_PASSWORD }}
          BOFEEL_LOGIN_ID: ${{ secrets.BOFEEL_LOGIN_ID }}
          BOFEEL_LOGIN_PASSWORD: ${{ secrets.BOFEEL_LOGIN_PASSWORD }}
          B2B_SUBMISSION_LEDGER_KEY: ${{ secrets.B2B_SUBMISSION_LEDGER_KEY }}
          FIREBASE_QUEUE_PATH: order-ops/jobs
          WORKER_ID: github-actions-order-worker
          GITHUB_TOKEN: ${{ github.token }}
        run: npm start

  # 브라우저 없는 이로움·보필 HTTP 장바구니 준비. 주문을 제출하지 않는다(시험 상품 담기→주문서 초안→삭제).
  # 수동 실행에서 b2b_http_cart 입력을 직접 켜고 저장소 변수 ENABLE_B2B_HTTP_CART가 'true'일 때만 돈다.
  # 즉시실행기(Apps Script) 호출과 예약 실행에서는 돌지 않는다.
  # 위 주문 처리 job과 승인·잠금·원장·Playwright 흐름은 이 job과 공유하지 않는다.
  b2b-http-cart:
    if: github.event_name == 'workflow_dispatch' && inputs.b2b_http_cart == true && vars.ENABLE_B2B_HTTP_CART == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP cart dependencies
        working-directory: worker/order-runner
        run: python -m pip install --disable-pip-version-check -r requirements-http.txt
      - name: Prepare carts without submitting
        working-directory: worker/order-runner
        env:
          ENABLE_B2B_HTTP_CART: ${{ vars.ENABLE_B2B_HTTP_CART }}
          EROUM_LOGIN_ID: ${{ secrets.EROUM_LOGIN_ID }}
          EROUM_LOGIN_PASSWORD: ${{ secrets.EROUM_LOGIN_PASSWORD }}
          BOFEEL_LOGIN_ID: ${{ secrets.BOFEEL_LOGIN_ID }}
          BOFEEL_LOGIN_PASSWORD: ${{ secrets.BOFEEL_LOGIN_PASSWORD }}
        shell: bash
        # 업체마다 1회만 실행한다. 실패하면 다음 업체로 넘어가지 않고 재시도하지 않는다.
        run: |
          node b2b-http-cart.mjs eroum
          node b2b-http-cart.mjs bofeel
